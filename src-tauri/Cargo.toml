[package]
name = "deszo"
version = "0.2.0"
description = "Personal desktop AI workflow orchestrator"
edition = "2021"

[[bin]]
name = "deszo"
path = "src/main.rs"

# Native launch shim (ADR-0002 section 4): starts every supervised CLI suspended inside its run Job.
[[bin]]
name = "deszo-launch-shim"
path = "src/bin/launch_shim.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
strip = true
opt-level = "s"
lto = true
