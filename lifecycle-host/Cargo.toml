[package]
name = "deszo-lifecycle-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "deszo_lifecycle_host"
path = "src/lib.rs"

[[bin]]
name = "deszo-lifecycle-host"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

